  function copiar(txt, okMsg) {
    try { navigator.clipboard.writeText(txt).then(() => toast(okMsg), () => toast("Não deu para copiar. Digite o valor na maquininha.", true)); }
    catch (e) { toast("Não deu para copiar. Digite o valor na maquininha.", true); }
  }

  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-action]"); if (!el) return;
    const a = el.dataset.action, id = el.dataset.id;
    if (a === "fechar-modal-fundo") { if (ev.target === el) fecharModal(); return; }
    if (a === "fechar-modal") { fecharModal(); return; }
    if (a === "sair") { sair(); return; }
    if (S.load !== "ready" && a !== "sheet") return;
    switch (a) {
      case "mesa-livre": formAbrir(Number(el.dataset.mesa)); break;
      case "nova-avulsa": formAbrir(null); break;
      case "abrir-conta": irConta(id); break;
      case "voltar": S.contaId = null; S.sheet = false; resetPg(); render("top"); window.scrollTo(0, 0); break;
      case "padd": {
        const p = prod(id); if (!p) return;
        if (S.view === "mesas" && S.contaId) lancar(S.contaId, id, 1);
        else { S.comanda.set(id, (S.comanda.get(id) || 0) + 1); render(true); }
        if (!p.semEstoque && (Number(p.estoque) || 0) - reservado(id) < 0) toast(`${p.nome}: pelo sistema já acabou. Confira a contagem.`, true);
        break;
      }
      case "cmais": lancar(S.contaId, id, 1); break;
      case "cmenos": lancar(S.contaId, id, -1); break;
      case "menos": { const q = (S.comanda.get(id) || 0) - 1; if (q > 0) S.comanda.set(id, q); else S.comanda.delete(id); render(true); break; }
      case "limpar": S.comanda.clear(); resetPg(); render(true); break;
      case "pag": S.pg.pag = el.dataset.pag; if (S.pg.pag !== "dinheiro") S.pg.recebido = ""; render(true); break;
      case "pg-tudo": S.pg.valor = ""; render(true); break;
      case "pg-div": { const c = conta(S.contaId); if (c) { S.pg.valor = numIn(round2(calc(c).restante / Number(el.dataset.d))); render(true); } break; }
      case "abrir-tap": {
        // Não bloqueia o link: só anota a cobrança para registrar na volta (ou perguntar).
        const base = Number(el.dataset.base), pag = el.dataset.pag;
        S.pendente = { id: S.orderId, ctx: el.dataset.ctx, base, pag, cobrado: cobranca(base, pag).cobrado, ts: Date.now() };
        salvarRascunho();
        setTimeout(() => render(true), 400);
        break;
      }
      case "nao-aprovou": S.pendente = null; S.orderId = null; render(true); toast("Ok, nada foi registrado. Pode cobrar de novo."); break;
      case "sim-aprovou": confirmarPendente(); break;
      case "receber": receber(); break;
      case "vender": venderBalcao(); break;
      case "editar-conta": { const c = conta(S.contaId); if (c) formEditarConta(c); break; }
      case "excluir-conta": {
        const c = conta(S.contaId); if (!c) return;
        if (armed("del:" + c.id)) {
          sbq(sb.from("contas").delete().eq("id", c.id)).then(() => {
            T.contas = T.contas.filter((x) => x.id !== c.id); montarContas(); S.contaId = null; render("top");
            toast(`${contaTitulo(c)} cancelada`);
          }, erroSalvar);
        }
        break;
      }
      case "copiar": copiar(el.dataset.txt, el.dataset.txt.length > 20 ? "Pix copia e cola copiado" : `Valor ${el.dataset.txt} copiado`); break;
      case "sheet": S.sheet = !S.sheet; render(true); break;
      case "cat": S.cat = el.dataset.cat; render(true); break;
      case "novo-produto": if (S.view !== "cardapio") location.hash = "cardapio"; formProduto(null); break;
      case "editar": { const p = prod(id); if (p) formProduto(p); break; }
      case "entrada": { const p = prod(id); if (p) formEntrada(p); break; }
      case "contagem": { const p = prod(id); if (p) formContagem(p); break; }
      case "cancelar-venda": if (armed("cancel:" + id)) estornar(id); break;
      case "fechar-dia": if (armed("fechar")) fecharDia(); break;
      case "salvar-ajustes": salvarAjustes(); break;
      case "apagar-exemplos": if (armed("exemplos")) apagarExemplos(); break;
    }
  });

  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.id === "busca") {
      S.busca = t.value;
      const pos = t.selectionStart;
      render(true);
      const nb = document.getElementById("busca"); if (nb) { nb.focus(); try { nb.setSelectionRange(pos, pos); } catch (e) { /* ok */ } }
    } else if (t.id === "recebido" || t.id === "pg-valor") {
      if (t.id === "recebido") S.pg.recebido = t.value; else S.pg.valor = t.value;
      const c = S.view === "mesas" ? conta(S.contaId) : null;
      const k = c ? calc(c) : balcaoCalc();
      let base = k.restante; const v = parseNum(S.pg.valor);
      if (c && S.pg.valor && Number.isFinite(v) && v > 0) base = round2(Math.min(v, k.restante));
      const cb = cobranca(base, S.pg.pag);
      const rec = parseNum(S.pg.recebido), troco = Number.isFinite(rec) ? rec - cb.cobrado : NaN;
      const tv = document.getElementById("troco-v"); if (tv) tv.textContent = trocoTxt(troco);
      const rs = document.getElementById("pg-resumo"); if (rs) rs.innerHTML = resumoPg(base, cb, k.restante);
      const btn = main.querySelector('[data-action="receber"], [data-action="vender"]');
      if (btn) btn.disabled = !(k.restante > 0 && S.pg.pag && !S.busy && (S.pg.pag !== "dinheiro" || !S.pg.recebido || troco >= -0.005));
    }
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.id === "dia-sel") { S.dia = t.value; t.blur(); render(true); }
    else if (t.id === "pg-valor") { t.blur(); render(true); }
    else if (t.id === "servico" && S.contaId) mudarConta(S.contaId, { servico: t.checked });
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && modalRoot.firstChild) fecharModal();
    if (ev.key === "Enter" && ev.target.id === "pg-valor") { ev.preventDefault(); ev.target.blur(); render(true); }
  });

  function confirmarPendente() {
    const p = S.pendente; if (!p) return;
    if (p.ctx === "balcao") { if (S.view !== "balcao") location.hash = "balcao"; venderBalcao(p); }
    else {
      if (!conta(p.ctx)) { S.pendente = null; toast("Essa conta não está mais aberta. Confira o pagamento no app da InfinitePay.", true); render(true); return; }
      if (S.view !== "mesas") location.hash = "mesas";
      S.contaId = p.ctx; S.sheet = true; receber(p);
    }
  }
  function processarRetorno() {
    // Só confere depois que cardápio e contas chegaram do banco (senão a conta parece fechada).
    if (!S.retorno || !sb || S.load !== "ready" || !S.chegou.produtos || !S.chegou.contas || !S.chegou.config) return;
    const r = S.retorno; S.retorno = null;
    if (!S.pendente || S.pendente.id !== r.id) { toast("Chegou um retorno da InfinitePay que não bate com nenhuma cobrança aberta neste aparelho. Confira no app.", true); return; }
    if (r.ok) { toast("Pagamento aprovado na InfinitePay"); confirmarPendente(); }
    else {
      const p = S.pendente; S.pendente = null; S.orderId = null;
      if (p.ctx !== "balcao" && conta(p.ctx)) { S.contaId = p.ctx; S.sheet = true; }
      render(true); toast("A InfinitePay não aprovou o pagamento. Tente de novo.", true);
    }
  }

  // ---------- pedido do balcão e cobrança enviada (ficam só neste aparelho)
  const RASCUNHO = "espetaria-balcao";
  function salvarRascunho() {
    try { localStorage.setItem(RASCUNHO, JSON.stringify({ comanda: [...S.comanda], pendente: S.pendente, orderId: S.orderId, orderKey: S.orderKey, em: Date.now() })); } catch (e) { /* sem armazenamento */ }
  }
  function carregarRascunho() {
    try {
      const r = JSON.parse(localStorage.getItem(RASCUNHO) || "null");
      if (r && Date.now() - (r.em || 0) < 6 * 3600e3) {
        S.comanda = new Map(r.comanda || []); S.pendente = r.pendente || null; S.orderId = r.orderId || null; S.orderKey = r.orderKey || null;
      }
    } catch (e) { /* ignora */ }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    // O celular pode ter dormido: busca tudo de novo para não mostrar mesa desatualizada.
    if (sb && S.load === "ready") recarregar(...TODAS);
    if (!S.pendente) return;
    const p = S.pendente;
    if (p.ctx === "balcao" && S.view === "balcao") { S.sheet = true; render(true); }
    else if (p.ctx !== "balcao" && S.view === "mesas" && conta(p.ctx)) { S.contaId = p.ctx; S.sheet = true; render(true); }
  });

  function rota() {
    let h = location.hash.replace("#", "");
    const m = h.match(/^(ok|falhou)-([A-Za-z0-9-]+)$/);
    if (m) {
      S.retorno = { ok: m[1] === "ok", id: m[2] };
      h = S.pendente && S.pendente.ctx === "balcao" ? "balcao" : "mesas";
      try { history.replaceState(null, "", "#" + h); } catch (e) { /* segue */ }
      setTimeout(processarRetorno, 0);
    }
    const nova = ["mesas", "balcao", "movimento", "cardapio"].includes(h) ? h : "mesas";
    if (nova !== S.view) { S.sheet = false; resetPg(); S.busca = ""; if (nova !== "mesas") S.contaId = null; }
    S.view = nova; S.armed = null;
    render("top"); window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", rota);
  setInterval(() => render(false), 60000); // tempo de mesa e virada do dia

  // ---------------------------------------------------------------- dados
  let canal = null, carregado = false;
  async function carregarTudo() {
    if (carregado) return; carregado = true;
    S.load = "loading"; render(true);
    const lento = setTimeout(() => { if (S.load === "loading") { S.load = "slow"; render(true); } }, 10000);
    try { await Promise.all(TODAS.map((t) => CARGA[t]())); S.load = "ready"; }
    catch (e) { console.error(e); S.load = "error"; }
    clearTimeout(lento);
    for (const id of [...S.comanda.keys()]) if (!prod(id)) S.comanda.delete(id);
    render(true); processarRetorno();
    // Tempo real: qualquer mudança feita em outro celular recarrega a tabela que mudou.
    canal = sb.channel("caixa")
      .on("postgres_changes", { event: "*", schema: "public" }, (p) => recarregar(p.table))
      .subscribe((st) => { if (st === "SUBSCRIBED" && S.load === "ready") recarregar(...TODAS); });
  }

  document.addEventListener("submit", (ev) => {
    if (ev.target.id === "login") { ev.preventDefault(); entrar(ev.target); }
  });

  async function init() {
    carregarRascunho();
    rota();
    const C = window.ESPETINHO || {};
    if (!C.supabaseUrl || !C.supabaseAnonKey || !window.supabase) { S.load = "semconfig"; render(true); return; }
    sb = window.supabase.createClient(C.supabaseUrl, C.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
    S.db = sb;
    sb.auth.onAuthStateChange((evento, sessao) => {
      if (sessao && sessao.user) { S.usuario = sessao.user.email || ""; carregarTudo(); }
      else if (evento === "SIGNED_OUT" || evento === "INITIAL_SESSION") { S.load = "login"; render(true); }
    });
  }
  init();

  // Instala como app no celular (funciona offline só para abrir a tela; os dados precisam de internet).
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>

</body>
</html>
